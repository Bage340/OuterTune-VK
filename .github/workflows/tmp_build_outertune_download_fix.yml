name: TEMP build OuterTune download-header fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact OuterTune source
        uses: actions/checkout@v4
        with:
          repository: yuuichi-s/OuterTune
          ref: b7f58abfd3e77b7548bee353761828cfd213a0c2
          fetch-depth: 0
          submodules: recursive
          path: source

      - name: Apply only download stream-header fix
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          python3 - <<'PY'
          from pathlib import Path

          yt = Path('app/src/main/java/com/dd3boh/outertune/utils/YTPlayerUtils.kt')
          s = yt.read_text()
          old = '''            streamClient ?: MAIN_CLIENT.clientName,\n        )'''
          new = '''            streamClient ?: MAIN_CLIENT.clientName,\n            streamHeaders,\n        )'''
          if old not in s:
              raise SystemExit('YTPlayerUtils PlaybackData return pattern not found')
          s = s.replace(old, new, 1)

          old = '''            val requestBuilder = okhttp3.Request.Builder()\n                .header("Range", "bytes=0-0")\n                .url(url)'''
          new = '''            val requestBuilder = okhttp3.Request.Builder()\n                .header("Range", "bytes=0-0")\n                .url(url)\n            headers.forEach { (name, value) -> requestBuilder.header(name, value) }'''
          if old not in s:
              raise SystemExit('YTPlayerUtils validateStatus pattern not found')
          s = s.replace(old, new, 1)
          yt.write_text(s)

          dl = Path('app/src/main/java/com/dd3boh/outertune/playback/DownloadUtil.kt')
          s = dl.read_text()
          old = '''    private val songUrlCache = HashMap<String, Pair<String, Long>>()\n    private val dataSourceFactory = ResolvingDataSource.Factory('''
          new = '''    private val songUrlCache = HashMap<String, Pair<String, Long>>()\n    private val songUrlHeaders = HashMap<String, Map<String, String>>()\n    private val dataSourceFactory = ResolvingDataSource.Factory('''
          if old not in s:
              raise SystemExit('DownloadUtil cache declaration pattern not found')
          s = s.replace(old, new, 1)

          old = '''        songUrlCache[mediaId]?.takeIf { it.second > System.currentTimeMillis() }?.let {\n            return@Factory dataSpec.withUri(it.first.toUri())\n        }'''
          new = '''        songUrlCache[mediaId]?.takeIf { it.second > System.currentTimeMillis() }?.let {\n            return@Factory dataSpec.withUri(it.first.toUri())\n                .withRequestHeaders(dataSpec.httpRequestHeaders + songUrlHeaders[mediaId].orEmpty())\n        }'''
          if old not in s:
              raise SystemExit('DownloadUtil cached URL pattern not found')
          s = s.replace(old, new, 1)

          old = '''        songUrlCache[mediaId] = streamUrl to System.currentTimeMillis() + (playbackData.streamExpiresInSeconds * 1000L)\n        dataSpec.withUri(streamUrl.toUri())'''
          new = '''        songUrlCache[mediaId] = streamUrl to System.currentTimeMillis() + (playbackData.streamExpiresInSeconds * 1000L)\n        songUrlHeaders[mediaId] = playbackData.streamHeaders\n        dataSpec.withUri(streamUrl.toUri())\n            .withRequestHeaders(dataSpec.httpRequestHeaders + playbackData.streamHeaders)'''
          if old not in s:
              raise SystemExit('DownloadUtil fresh URL pattern not found')
          s = s.replace(old, new, 1)
          dl.write_text(s)

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          if 'versionCode = 85' not in s:
              raise SystemExit('versionCode 85 not found')
          s = s.replace('versionCode = 85', 'versionCode = 86', 1)
          gradle.write_text(s)
          PY

          # Verify only the intended source edits plus the operational versionCode bump.
          git diff -- app/src/main/java/com/dd3boh/outertune/utils/YTPlayerUtils.kt \
                     app/src/main/java/com/dd3boh/outertune/playback/DownloadUtil.kt \
                     app/build.gradle.kts | tee /tmp/intended.patch
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' app/build.gradle.kts app/src/main/java/com/dd3boh/outertune/playback/DownloadUtil.kt app/src/main/java/com/dd3boh/outertune/utils/YTPlayerUtils.kt | sort)"
          grep -q 'streamHeaders,' app/src/main/java/com/dd3boh/outertune/utils/YTPlayerUtils.kt
          grep -q 'songUrlHeaders' app/src/main/java/com/dd3boh/outertune/playback/DownloadUtil.kt
          grep -q 'versionCode = 86' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Generate persistent signing key for this patched build
        shell: bash
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/source/outertune-download-fix.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass 'OuterTuneDownloadFix2026' \
            -keypass 'OuterTuneDownloadFix2026' \
            -alias outertune-download-fix \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=OuterTune Download Fix, OU=Local Build, O=OuterTune, L=Local, ST=Local, C=US'
          cat > "$GITHUB_WORKSPACE/source/keystore.properties" <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=OuterTuneDownloadFix2026
          keyAlias=outertune-download-fix
          keyPassword=OuterTuneDownloadFix2026
          EOF
          test -s "$KEYSTORE_FILE"

      - name: Build same-package Core APK
        shell: bash
        run: |
          cd source
          ./gradlew :app:assembleCoreUserdebug --stacktrace -DskipFormatKtlint

      - name: Verify APK identity and signature
        shell: bash
        run: |
          APK="$(find source/app/build/outputs/apk/core/userdebug -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then APK="$(find source/app/build/outputs/apk/core/userdebug -name '*.apk' -print -quit)"; fi
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.dd3boh.outertune' versionCode='86' versionName='0.10.15'" apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          cp "$APK" OuterTune-0.10.15-download-fix.apk
          cp source/outertune-download-fix.jks outertune-download-fix-signing-key.jks
          cat > signing-key-info.txt <<'EOF'
          Alias: outertune-download-fix
          Store password: OuterTuneDownloadFix2026
          Key password: OuterTuneDownloadFix2026
          Keep this key private; future APK updates must be signed with this same key.
          EOF
          cp /tmp/intended.patch intended-download-fix.patch
          sha256sum OuterTune-0.10.15-download-fix.apk outertune-download-fix-signing-key.jks | tee SHA256SUMS.txt

      - name: Upload APK and signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: OuterTune-0.10.15-download-fix
          if-no-files-found: error
          retention-days: 1
          path: |
            OuterTune-0.10.15-download-fix.apk
            outertune-download-fix-signing-key.jks
            signing-key-info.txt
            intended-download-fix.patch
            SHA256SUMS.txt
            apk-badging.txt
            apk-signature.txt

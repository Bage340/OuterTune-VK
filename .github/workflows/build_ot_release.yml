name: Build APKs for release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build unsigned core release APK
        run: ./gradlew assembleCoreRelease

      - name: Resolve pinned ffmpeg libs
        run: |
          git clone --no-checkout https://github.com/mikooomich/ffmpeg-android-maker-prebuilt/ ffMetadataEx/ffmpeg-android-maker
          git -C ffMetadataEx/ffmpeg-android-maker checkout fdd9e2482f232da676fdc5ef6622ca444238e9bc

      - name: Build unsigned full release APK
        run: ./gradlew assembleFullRelease

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-apks
          if-no-files-found: error
          retention-days: 1
          path: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk

  sign-and-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install APK signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'

      - name: Download unsigned APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-apks
          path: signed-apks

      - name: Sign and verify APKs
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/outertune-vk-release.jks"
          PROPERTIES_FILE="$RUNNER_TEMP/outertune-vk-keystore.properties"
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYSTORE_FILE"
          printf '%s' "$KEYSTORE_PROPERTIES" > "$PROPERTIES_FILE"

          property() {
            sed -n "s/^$1=//p" "$PROPERTIES_FILE" | tail -n 1
          }
          KS_ALIAS="$(property keyAlias)"
          KS_PASS="$(property storePassword)"
          KEY_PASS="$(property keyPassword)"
          test -n "$KS_ALIAS"
          test -n "$KS_PASS"
          if [ -z "$KEY_PASS" ]; then KEY_PASS="$KS_PASS"; fi
          export KS_PASS KEY_PASS

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          while IFS= read -r -d '' apk; do
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              "$apk"
            "$APKSIGNER" verify --verbose "$apk"
          done < <(find signed-apks -type f -name '*.apk' -print0)

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/outertune-vk-release.jks"
          rm -f "$RUNNER_TEMP/outertune-vk-keystore.properties"

      - name: Get date-time string
        run: echo "date_tag=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create github release draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ env.date_tag }}
          name: "Build ${{ env.date_tag }}"
          draft: true
          files: signed-apks/**/*.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}

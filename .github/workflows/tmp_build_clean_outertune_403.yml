name: TEMP build clean OuterTune 0.10.15 403 fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact fixed OuterTune source
        uses: actions/checkout@v4
        with:
          repository: yuuichi-s/OuterTune
          ref: b7f58abfd3e77b7548bee353761828cfd213a0c2
          fetch-depth: 0
          submodules: recursive
          path: source

      - name: Verify exact source and requested fix
        shell: bash
        run: |
          cd source
          test "$(git rev-parse HEAD)" = "b7f58abfd3e77b7548bee353761828cfd213a0c2"
          test "$(git -C media rev-parse HEAD)" = "3f52f92e3532b9915ae6fec3dd72ebff9bde0e0a"
          grep -q 'versionCode = 85' app/build.gradle.kts
          grep -q 'versionName = "0.10.15"' app/build.gradle.kts
          grep -q 'applicationId = "com.dd3boh.outertune"' app/build.gradle.kts
          grep -R -q 'VISIONOS' innertube app/src/main/java
          if grep -R -q 'com.bage340.outertunevk' app innertube; then
            echo 'Unexpected OuterTune-VK code found in checked-out source' >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Generate isolated signing key for same-package APK
        shell: bash
        run: |
          KEYSTORE_FILE="$GITHUB_WORKSPACE/source/outertune-clean-build.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass 'OuterTuneCleanBuild2026' \
            -keypass 'OuterTuneCleanBuild2026' \
            -alias outertune-clean-build \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname 'CN=OuterTune Clean Build, OU=Local Build, O=OuterTune, L=Local, ST=Local, C=US'
          cat > "$GITHUB_WORKSPACE/source/keystore.properties" <<EOF
          storeFile=$KEYSTORE_FILE
          storePassword=OuterTuneCleanBuild2026
          keyAlias=outertune-clean-build
          keyPassword=OuterTuneCleanBuild2026
          EOF
          test -s "$KEYSTORE_FILE"

      - name: Build clean fixed APKs
        shell: bash
        run: |
          cd source
          ./gradlew :app:assembleCoreUserdebug :app:assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Verify package identity, version and signatures
        shell: bash
        run: |
          USERDEBUG="$(find source/app/build/outputs/apk/core/userdebug -name '*universal*.apk' -print -quit)"
          if [ -z "$USERDEBUG" ]; then USERDEBUG="$(find source/app/build/outputs/apk/core/userdebug -name '*.apk' -print -quit)"; fi
          DEBUGAPK="$(find source/app/build/outputs/apk/core/debug -name '*universal*.apk' -print -quit)"
          if [ -z "$DEBUGAPK" ]; then DEBUGAPK="$(find source/app/build/outputs/apk/core/debug -name '*.apk' -print -quit)"; fi
          test -n "$USERDEBUG"
          test -n "$DEBUGAPK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$USERDEBUG" | tee userdebug-badging.txt
          "$AAPT" dump badging "$DEBUGAPK" | tee debug-badging.txt
          grep -q "package: name='com.dd3boh.outertune' versionCode='85'" userdebug-badging.txt
          grep -q "package: name='com.dd3boh.outertune.debug' versionCode='85'" debug-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$USERDEBUG" | tee userdebug-signature.txt
          "$APKSIGNER" verify --verbose --print-certs "$DEBUGAPK" | tee debug-signature.txt
          cp "$USERDEBUG" OuterTune-0.10.15-403fix-core-same-package.apk
          cp "$DEBUGAPK" OuterTune-0.10.15-403fix-core-debug-side-by-side.apk
          sha256sum OuterTune-0.10.15-403fix-core-*.apk | tee SHA256SUMS.txt

      - name: Upload final APKs
        uses: actions/upload-artifact@v4
        with:
          name: OuterTune-0.10.15-403fix-final
          if-no-files-found: error
          retention-days: 1
          path: |
            OuterTune-0.10.15-403fix-core-same-package.apk
            OuterTune-0.10.15-403fix-core-debug-side-by-side.apk
            SHA256SUMS.txt
            userdebug-badging.txt
            debug-badging.txt
            userdebug-signature.txt
            debug-signature.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/source/outertune-clean-build.jks"
          rm -f "$GITHUB_WORKSPACE/source/keystore.properties"

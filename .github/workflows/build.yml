name: Build OuterTune APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
          cache-dependency-path: "**/*.gradle*"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Test, lint, and build unsigned APK
        run: ./gradlew testCoreDebugUnitTest lintCoreUserdebug assembleCoreUserdebug --stacktrace -DskipFormatKtlint

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/core/userdebug -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then APK="$(find app/build/outputs/apk/core/userdebug -name '*.apk' -print -quit)"; fi
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.dd3boh.outertune' versionCode='91' versionName='0.10.15'" apk-badging.txt
          cp "$APK" OuterTune-0.10.15-v91-unsigned.apk
          sha256sum OuterTune-0.10.15-v91-unsigned.apk | tee SHA256SUMS.txt

      - name: Upload verified unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-0.10.15-v91-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            OuterTune-0.10.15-v91-unsigned.apk
            apk-badging.txt
            SHA256SUMS.txt

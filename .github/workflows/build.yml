name: Build and verify debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Install pinned Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.13113456' \
            'cmake;3.31.6'

      - name: Unit tests, lint, and core debug APK
        run: |
          ./gradlew \
            :app:testCoreDebugUnitTest \
            :app:lintCoreDebug \
            :app:assembleCoreDebug \
            --stacktrace \
            -DskipFormatKtlint

      - name: Verify fork package identity
        run: |
          APK="$(find app/build/outputs/apk/core/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.bage340.outertunevk.debug'" apk-badging.txt

      - name: Enable KVM for migration tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Room 20 to 21 migration test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 4096M
          script: >-
            ./gradlew :app:connectedCoreDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.dd3boh.outertune.db.Migration20To21Test
            --stacktrace -DskipFormatKtlint

      - name: Upload development APK and package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OuterTune-VK-core-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/core/debug/*.apk
            apk-badging.txt

name: Build OuterTune 403-fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/outertune-403-fix'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Port current yuuichi-s 403 fix
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://raw.githubusercontent.com/yuuichi-s/OuterTune/dev'
          mkdir -p app/src/main/java/com/dd3boh/outertune/utils/cipher app/src/main/assets
          curl -fL "$BASE/app/src/main/java/com/dd3boh/outertune/utils/YTPlayerUtils.kt" -o app/src/main/java/com/dd3boh/outertune/utils/YTPlayerUtils.kt
          for f in CipherWebView.kt PlayerCipherConfig.kt PlayerJsFetcher.kt SignatureCipherManager.kt; do
            curl -fL "$BASE/app/src/main/java/com/dd3boh/outertune/utils/cipher/$f" -o "app/src/main/java/com/dd3boh/outertune/utils/cipher/$f"
          done
          curl -fL "$BASE/app/src/main/assets/player_configs.json" -o app/src/main/assets/player_configs.json
          sed -i 's/version = "d59dc216f"/version = "v0.26.3"/' gradle/libs.versions.toml
          sed -i 's/"GPL-3.0-only",/"GPL-3.0-only", "GPL-3.0-or-later",/' app/build.gradle.kts

      - name: Install Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build core debug APK
        run: ./gradlew :app:assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/core/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.bage340.outertunevk.debug'" apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OuterTune-403-fix-core-debug
          if-no-files-found: error
          path: |
            app/build/outputs/apk/core/debug/*.apk
            apk-badging.txt
            apk-sha256.txt
